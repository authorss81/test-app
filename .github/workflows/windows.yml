name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Visual Studio installations
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -products * -requires Microsoft.Component.MSBuild -property installationPath
          } else {
            Write-Host "vswhere not found"
          }

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows EXE (release)
        run: flutter build windows --release

      - name: Zip build output
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath windows-build.zip -Force

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: windows-build.zip
          if-no-files-found: error